<!DOCTYPE html>
<html>
<body style="
    margin: 0;
    padding: 0;
    background-color: #f3f4f6;
    font-family: Arial, Helvetica, sans-serif;
">

<div style="
    max-width: 600px;
    margin: 40px auto;
    background-color: white;
    border-radius: 10px;
    overflow: hidden;
">

    <div style="
        background-color: #111827;
        padding: 24px 30px;
    ">
        <h1 style="color: white; margin: 0;">
            SOC Security Alert
        </h1>

        <p style="color: #cbd5e1;">
            Investigation Required
        </p>
    </div>

    <div style="padding: 30px;">

        <p>
            Hi <strong>$name</strong>,
        </p>

        <p>
            You have received a new security alert.
        </p>

        <div style="
            background-color: #f9fafb;
            border-left: 5px solid #dc2626;
            padding: 18px;
            margin: 25px 0;
        ">
            <strong>Status:</strong> Investigation Required
        </div>

        <p>
            Open Splunk and investigate the available telemetry.
        </p>

        <p>
            Once complete, provide your findings to your AI SOC lead.
        </p>

        <p style="margin-top: 30px; color: #6b7280;">
            SOC Analyst Team Leader
        </p>

    </div>

</div>

</body>
</html>
